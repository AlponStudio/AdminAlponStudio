.hello b{color:#fff}
.tbtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#FAFAF8;display:grid;place-items:center;cursor:pointer;padding:0}
.tbtn svg{width:18px;height:18px}
.bal{position:relative;z-index:1;margin-top:-26px;background:var(--sf);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.balh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(90deg,#1A2A44,#2F4F82);color:#fff}
.chip{font-size:.76rem;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:2px 10px}
.balh .sync{color:#DCE4F2;font-size:.72rem}
.balb{padding:12px 14px 14px}
.lbl{font-size:.78rem;color:var(--mute)}
.balr{display:flex;justify-content:space-between;align-items:center;gap:8px}
#kas{font:400 2.4rem/1.1 "Bebas Neue",Impact,sans-serif;letter-spacing:.02em}
.eye{border:0;background:none;color:var(--ico);padding:6px;cursor:pointer;display:grid}
.eye svg{width:24px;height:24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
.stats>div{min-width:0}
.stats span{display:block;font-size:.72rem;color:var(--mute)}
.stats b{display:block;font:400 1.35rem/1.1 "Bebas Neue",Impact,sans-serif;letter-spacing:.02em}
.stats .p{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-radius:12px;padding:8px 12px}
.stats .p span{color:#B9C4D6}
.stats .p b{font-size:1.5rem;color:#fff}
@media(min-width:760px){.stats{grid-template-columns:1fr 1fr 1.2fr}}
.mh{margin:20px 0 10px}
.mh h3{margin:0;font-size:1.05rem;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.mi{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;display:grid;justify-items:center;gap:6px;text-align:center}
.mi i{position:relative;font-style:normal;width:56px;height:56px;border-radius:18px;background:var(--tint);color:var(--ico);display:grid;place-items:center}
.mi svg{width:26px;height:26px}
.mi span{font-size:.74rem;line-height:1.2}
.mi:focus-visible,.promo:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.bdg{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font:600 .65rem Inter,sans-serif;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.promo{margin-top:14px;width:100%;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(110deg,#0D0D0D,#1A2A44);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:left;font:inherit;position:relative;overflow:hidden}
.promo{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.promo b{display:block;font:400 1.3rem/1.1 "Bebas Neue",Impact,sans-serif;letter-spacing:.04em}
.promo span{font-size:.78rem;color:#C9D4EA}
.promo::after{content:"";position:absolute;right:-18px;top:-18px;width:76px;height:76px;border-radius:50%;background:var(--red)}
.promo svg{position:relative;z-index:1;width:22px;height:22px;color:#fff;flex:none}
.h2{font:700 1.05rem Inter,sans-serif;letter-spacing:0;margin:22px 0 8px}
.bk h2{font:700 1.1rem Inter,sans-serif;letter-spacing:0}
.bk button{border:0;background:var(--tint);border-radius:999px;padding:6px 12px}
.tabs{flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:6px 0 10px}
.tabs button{font:500 .8rem Inter,sans-serif;letter-spacing:0;white-space:nowrap;border:0;background:var(--tint);color:var(--ink);border-radius:999px;padding:6px 12px;margin:0}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{background:var(--sf);border:0;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row:last-child{border-bottom:0}
.head{padding:11px 14px}
.det{padding:0 14px 14px}
.stk{border-radius:6px}
.chips button{border:0;background:var(--tint);border-radius:999px;padding:5px 12px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.go{border-radius:12px;font:600 .9rem Inter,sans-serif;letter-spacing:0;padding:10px 18px}
.invg input,.invg select,.invg textarea{border-radius:10px}
.invg details{border-radius:12px}
.sumb{background:var(--sf);border:0;border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
#proj-tbl{background:var(--sf);border-radius:16px;padding:2px 14px;box-shadow:var(--shadow)}
.pr:last-child{border-bottom:0}
.bars5,.trend,.cardx{background:var(--sf);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.trend .bars5{background:none;padding:0;box-shadow:none}
.cardx{padding:6px 14px}
.pvwrap{border-radius:12px}
#toast{border-radius:10px}
.jr{font:500 .8em Poppins,sans-serif;letter-spacing:.6em;padding-left:.6em}
</style>
</head>

 '<div><p class="src" style="margin:0 0 8px">Pratinjau mengikuti template invoice Alpon Studio.</p><div class="pvwrap"><div class="pvw"><div id="inv-prev">'+prevHtml()+'</div></div></div></div></div>';

function invBind(mv){
 mv.querySelectorAll("[data-k]").forEach(function(e){e.oninput=e.onchange=function(){var k=e.dataset.k;inv[k]=e.value;if(k==="no")inv.noManual=true;if(k==="tgl"&&!inv.noManual){inv.no=nextNo(inv.tgl);var f=mv.querySelector('[data-k="no"]');if(f)f.value=inv.no}prevUp()}});
 mv.querySelectorAll("[data-s]").forEach(function(e){e.oninput=function(){SET[e.dataset.s]=e.value;prevUp()}});
 mv.querySelectorAll("[data-gt]").forEach(function(e){e.oninput=function(){inv.groups[+e.dataset.gt].t=e.value;prevUp()}});
 mv.querySelectorAll("[data-ii]").forEach(function(e){e.oninput=function(){inv.groups[+e.dataset.gi].items[+e.dataset.ii][e.dataset.c]=e.value;prevUp()}});
 mv.querySelectorAll("[data-di]").forEach(function(e){e.onclick=function(){var p=e.dataset.di.split(":"),g=inv.groups[+p[0]];g.items.splice(+p[1],1);if(!g.items.length)g.items.push({d:"",q:1,h:0});more()}});

 mv.querySelectorAll("[data-dg]").forEach(function(e){e.onclick=function(){inv.groups.splice(+e.dataset.dg,1);more()}});

 document.getElementById("save-inv").onclick=invSave;

function invSave(){
 var c=calc();
 if(!inv.klien.trim()){toast("Isi Client Name dulu.");return}
 if(c.t<=0){toast("Isi minimal satu item dengan harga.");return}
 if(data.some(function(d){return d.id===inv.no})){toast("Nomor "+inv.no+" sudah dipakai.");return}
 var pid="n"+(Object.keys(P).length+1),paid=inv.dpPaid==="1";
 P[pid]=inv.proyek.trim()||("Proyek "+inv.klien.trim());
 data.push({id:inv.no,type:"c",who:inv.klien.trim(),pid:pid,tot:c.t,dp:paid?c.dp:0,dpReq:paid?0:c.dp,amt:c.due,due:inv.jt||TODAY_ISO});
 toast("Invoice "+inv.no+" disimpan. Muncul di Menunggu dari klien.");
 invNew();view="r";tab="c";openId=null;render();
}
function payDp(id){
 var d=data.find(function(x){return x.id===id}),a=d.dpReq;
 tx.push({id:"IN-"+(200+tx.length),type:"in",iso:TODAY_ISO,who:d.who,ket:"DP "+d.id,kat:"DP",pid:d.pid,amt:a,nota:null});
 d.dp+=a;d.amt-=a;d.dpReq=0;kas+=a;
 toast("DP "+rp(a)+" dari "+d.who+" dicatat. Saldo kas bertambah.");
 openId=null;render();
}

var trx=null;
var CATS={out:["Transport","Sewa alat","Peralatan","Software","Produksi","Manpower","Konsumsi","Operasional","Lainnya"],in:["DP","Pelunasan","Lainnya"]};
var RULES={out:[["Transport",/bensin|bbm|pertalite|pertamax|tol|parkir|grab|gojek|ojek|travel|tiket|kereta|bus/],["Sewa alat",/sewa|rental|lensa|gimbal|drone|lighting|sound/],["Peralatan",/hard ?disk|hdd|ssd|kamera|baterai|tripod|memory|kabel|mic|laptop/],["Software",/adobe|langganan|software|lisensi|subscription|premiere|canva|domain|hosting/],["Produksi",/cetak|banner|properti|backdrop|print|stiker/],["Manpower",/honor|crew|fee|freelance|editor|videographer|fotografer|upah|gaji/],["Konsumsi",/makan|konsumsi|snack|kopi|minum|catering|nasi/],["Operasional",/kertas|atk|tinta|listrik|internet|wifi|pulsa|kebersihan/]],in:[["Pelunasan",/pelunasan|lunas/],["DP",/\bdp\b|uang muka|down ?payment/]]};
function guess(t,ty){var s=t.toLowerCase(),r=RULES[ty];for(var i=0;i<r.length;i++)if(r[i][1].test(s))return r[i][0];return "Lainnya"}
function trxNew(ty){trx={type:ty||"out",iso:TODAY_ISO,who:"",ket:"",amt:"",pid:"",kat:"Lainnya",manual:false,img:null}}

 if(!trx)trxNew();

 '<p class="src" style="margin:4px 0 0">Di versi tersambung, AI membaca nota untuk mengisi nominal, tanggal, dan kategori. Di prototipe ini kategori ditebak dari keterangan.</p></div>'+
 '<button class="go" id="save-trx">Simpan transaksi</button></div></div>';
}
function trxBind(mv){
 mv.querySelectorAll("[data-ty]").forEach(function(b){b.onclick=function(){trx.type=b.dataset.ty;trx.manual=false;trx.kat=guess(trx.ket+" "+trx.who,trx.type);more()}});
 mv.querySelectorAll("[data-x]").forEach(function(e){e.oninput=e.onchange=function(){
  var k=e.dataset.x;trx[k]=e.value;
  if(k==="kat")trx.manual=true;
  else if(!trx.manual&&(k==="ket"||k==="who")){trx.kat=guess(trx.ket+" "+trx.who,trx.type);var s=document.getElementById("kat-sel");if(s)s.value=trx.kat}

function trxSave(){
 var a=+trx.amt;
 if(!trx.who.trim()||!trx.ket.trim()){toast("Isi nama dan keterangan dulu.");return}
 if(!(a>0)){toast("Isi nominal yang benar.");return}
 var ty=trx.type,id=(ty==="in"?"IN-":"EX-")+(300+tx.length);
 tx.push({id:id,type:ty,iso:trx.iso||TODAY_ISO,who:trx.who.trim(),ket:trx.ket.trim(),kat:trx.kat,pid:trx.pid||null,amt:a,nota:trx.img?{img:trx.img}:null});
 if(ty==="in")kas+=a;else kas-=a;
 toast((ty==="in"?"Pemasukan ":"Pengeluaran ")+rp(a)+" dicatat sebagai "+trx.kat+(ty==="out"&&!trx.img?". Nota belum dilampirkan.":"."));

}

render();
